server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

file:
  upload:
    dir: ./uploads

jwt:
  secret: evalorithm-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000
  refresh-expiration: 604800000
  token-prefix: "Bearer "
  header: Authorization

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.evalorithm: INFO
    org.springframework.security: INFO
